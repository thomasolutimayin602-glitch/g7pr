  <style>
    * { box-sizing: border-box; }
    :root {
      --page-w: 521.575;
      --page-h: 737.00808;
      --ink: #2a241a;
      --accent: #e00000;
    }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #efe8d8;
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      overflow: hidden;
    }
    .app {
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #e6dcc9, #f7f1e5);
      border: 1px solid rgba(82, 63, 34, 0.16);
      border-radius: 16px;
    }
    .page-scale {
      position: relative;
      width: min(calc(100vw - 24px), calc((100dvh - 24px) * var(--page-w) / var(--page-h)));
      aspect-ratio: var(--page-w) / var(--page-h);
      background: white;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(42, 32, 18, 0.24);
    }
    .page-native {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(var(--page-w) * 1px);
      height: calc(var(--page-h) * 1px);
      transform-origin: 0 0;
    }
    .page-native > canvas, .text-layer, .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .page-canvas { z-index: 1; }
    .text-layer {
      z-index: 2;
      pointer-events: none;
      transform-origin: 0 0;
    }
    .pdf-char {
      position: absolute;
      display: block;
      white-space: pre;
      line-height: 1;
      overflow: visible;
      transform-origin: left top;
    }
    .image-backed .pdf-char { opacity: 0 !important; }
    .pdf-char.active { color: var(--accent) !important; opacity: 1 !important; }
    .overlay { z-index: 3; }
    .point-hotspot {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hit {
      position: absolute;
      background: transparent;
      cursor: pointer;
      pointer-events: all;
    }
    .point-hotspot:hover .hit { background: transparent; }
    .tape-btn {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #e06000;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 5;
      padding: 0;
      box-shadow: 0 2px 6px rgba(224, 96, 0, 0.4);
      transition: all 0.2s ease;
      pointer-events: all;
    }
    .tape-btn:hover {
      background: #f07010;
      transform: scale(1.1);
    }
    .tape-btn.active {
      background: #e00000;
      box-shadow: 0 0 10px rgba(224, 0, 0, 0.6);
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    .nav, aside {
      position: fixed;
      z-index: 10;
      background: rgba(255, 252, 244, 0.92);
      border: 1px solid rgba(82, 63, 34, 0.16);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(42, 32, 18, 0.2);
      backdrop-filter: blur(10px);
    }
    .nav {
      left: 16px;
      top: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
    }
    .nav a, .panel-toggle, button[data-target], .voice-picker select {
      border-radius: 8px;
      border: 1px solid transparent;
      color: #3a2d1f;
      font: inherit;
      text-decoration: none;
    }
    .nav a {
      display: inline-block;
      padding: 8px 10px;
      background: #fffaf0;
    }
    .nav a.disabled {
      color: #a79b8c;
      pointer-events: none;
    }
    .nav strong { padding: 0 4px; font-size: 14px; }
    .voice-picker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-left: 4px;
      color: #6b6255;
      font-size: 13px;
      white-space: nowrap;
    }
    .voice-picker select {
      padding: 7px 26px 7px 8px;
      background: #fffaf0;
      cursor: pointer;
    }
    aside {
      right: 16px;
      top: 16px;
      width: min(380px, calc(100vw - 32px));
      max-height: calc(100dvh - 32px);
      overflow: hidden;
      padding: 16px;
    }
    aside:not(.open) {
      width: auto;
      padding: 0;
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    .panel-toggle {
      width: auto;
      padding: 9px 12px;
      background: rgba(255, 252, 244, 0.94);
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(42, 32, 18, 0.18);
    }
    aside.open .panel-toggle {
      margin-bottom: 12px;
      box-shadow: none;
    }
    aside:not(.open) .panel-content { display: none; }
    .panel-content {
      max-height: calc(100dvh - 100px);
      overflow: auto;
    }
    h1 { margin: 0 0 8px; font-size: 19px; }
    .meta { margin: 0 0 14px; color: #6b6255; font-size: 13px; line-height: 1.5; }
    ol { margin: 0; padding-left: 22px; }
    li { margin: 0 0 8px; }
    button[data-target] {
      width: 100%;
      padding: 7px 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    button[data-target] b {
      display: inline-block;
      min-width: 1.7em;
      color: #8a5b22;
    }
    .audio-badge {
      float: right;
      margin-left: 8px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.5;
      color: #5f503f;
      background: #eadfcd;
    }
    .audio-badge.source {
      color: #1f5f3c;
      background: #dcebdc;
    }
    .audio-badge.pending {
      color: #704915;
      background: #f3dfbd;
    }
    button:hover, .nav a:hover { background: #f4ead8; }
    button.active {
      color: var(--accent);
      background: rgba(224, 0, 0, 0.08);
      border-color: rgba(224, 0, 0, 0.24);
    }
    @media (max-width: 900px) {
      .app { padding: 8px; }
      .stage { border-radius: 12px; }
      .page-scale {
        width: min(calc(100vw - 16px), calc((100dvh - 16px) * var(--page-w) / var(--page-h)));

      .nav {
        left: 10px;
        top: 10px;
      }
      aside {
        right: 10px;
        top: 58px;
        max-height: calc(100dvh - 68px);
      }
      .panel-content { max-height: calc(100dvh - 136px); }
    }

      });
    }

    function syncNativeScale() {
      const scale = pageScale.clientWidth / pageDrawingData.width;
      pageNative.style.transform = `scale(${scale})`;
      return scale;
    }

    async function drawPageCanvas() {
      const generation = ++drawGeneration;
      const displayScale = syncNativeScale();
      const pixelScale = Math.max(1, (window.devicePixelRatio || 1) * displayScale);
      canvas.width = Math.round(pageDrawingData.width * pixelScale);
      canvas.height = Math.round(pageDrawingData.height * pixelScale);
      ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
      ctx.clearRect(0, 0, pageDrawingData.width, pageDrawingData.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, pageDrawingData.width, pageDrawingData.height);
      const image = await loadImage(pageDrawingData.background);
      if (generation !== drawGeneration) return;
      ctx.drawImage(image, 0, 0, pageDrawingData.width, pageDrawingData.height);
    }

    drawPageCanvas();
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => drawPageCanvas()).observe(pageScale);
    } else {
      window.addEventListener('resize', drawPageCanvas);
    }

    const groups = Array.from(document.querySelectorAll('.point-hotspot'));
    const buttons = Array.from(document.querySelectorAll('button[data-target]'));
    const tapeButtons = Array.from(document.querySelectorAll('.tape-btn'));
    const panel = document.querySelector('#point-panel');
    const panelToggle = document.querySelector('.panel-toggle');
    const voiceSelect = document.querySelector('#voice-select');
    const pointAudio = new Audio();
    let activeChars = [];
    const savedVoice = localStorage.getItem('pointreadVoice') || 'cloned-male';
    if (voiceSelect && Array.from(voiceSelect.options).some((option) => option.value === savedVoice)) {
      voiceSelect.value = savedVoice;
    }

    panelToggle.addEventListener('click', () => {
      const open = !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      panelToggle.setAttribute('aria-expanded', String(open));
    });

    function setActive(id) {
      const group = groups.find((item) => item.dataset.target === id);
      const button = buttons.find((item) => item.dataset.target === id);
      if (!group) return;
      tapeButtons.forEach((b) => b.classList.remove('active'));
      const alreadyActive = group.classList.contains('active');
      groups.forEach((item) => item.classList.remove('active'));
      buttons.forEach((item) => item.classList.remove('active'));
      activeChars.forEach((item) => item.classList.remove('active'));
      activeChars = [];
      if (alreadyActive) return;
      group.classList.add('active');
      if (button) button.classList.add('active');
      const charIds = JSON.parse(group.dataset.charIds || '[]');
      activeChars = charIds.map((charId) => document.getElementById(charId)).filter(Boolean);
      activeChars.forEach((item) => item.classList.add('active'));
      playPointAudio(group);
    }

    function audioSrcFor(group, voice) {
      if (!group) return '';
      if (group.dataset.sourceSrc) return group.dataset.sourceSrc;
      if (group.dataset.audioSrc) return group.dataset.audioSrc;
      return '';
    }

    function setAudioSource(src) {
      if (!src) return false;
      const absoluteSrc = new URL(src, location.href).href;
      if (pointAudio.src !== absoluteSrc) {
        pointAudio.src = absoluteSrc;
      }
      return true;
    }

    function playPointAudio(group) {
      if (!group) return;
      const voice = voiceSelect ? voiceSelect.value : 'default';
      const primarySrc = group.dataset.sourceSrc || '';
      const fallbackSrc = group.dataset.audioSrc || '';
      const activeSrc = primarySrc || fallbackSrc;
      if (!activeSrc) return;
      pointAudio.pause();
      pointAudio.currentTime = 0;
      pointAudio.onerror = () => {
        if (activeSrc === primarySrc && fallbackSrc && setAudioSource(fallbackSrc)) {
          pointAudio.onerror = null;
          pointAudio.play().catch(() => {});
        }
      };
      setAudioSource(activeSrc);
      pointAudio.play().catch(() => {});
    }

    if (voiceSelect) {
      voiceSelect.addEventListener('change', () => {
        localStorage.setItem('pointreadVoice', voiceSelect.value);
        const activeGroup = groups.find((item) => item.classList.contains('active'));
        if (activeGroup) playPointAudio(activeGroup);
      });
    }

    groups.forEach((group) => {
      group.querySelectorAll('.hit').forEach((hit) => {
        hit.addEventListener('click', () => setActive(group.dataset.target));
      });
    });
    buttons.forEach((button) => {
      button.addEventListener('click', () => setActive(button.dataset.target));
    });
    tapeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const audioSrc = btn.dataset.audioSrc;
        const isActive = btn.classList.contains('active');
        tapeButtons.forEach((b) => b.classList.remove('active'));
        groups.forEach((item) => item.classList.remove('active'));
        buttons.forEach((item) => item.classList.remove('active'));
        activeChars.forEach((item) => item.classList.remove('active'));
        activeChars = [];
        if (isActive) {
          pointAudio.pause();
        } else {
          btn.classList.add('active');
          pointAudio.pause();
          pointAudio.currentTime = 0;
          pointAudio.onerror = null;
          setAudioSource(audioSrc);
          pointAudio.play().catch(() => {});
        }
      });
    });
    pointAudio.addEventListener('ended', () => {
      tapeButtons.forEach((b) => b.classList.remove('active'));
    });
    pointAudio.addEventListener('pause', () => {
      tapeButtons.forEach((b) => b.classList.remove('active'));
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' && true) location.href = "page-010.html";
      if (event.key === 'ArrowRight' && true) location.href = "page-012.html";
    });
  </script>

  <script>
  /* preload-page-audio */
  (function () {
    function preloadPageAudio() {
      var urls = {};
      document.querySelectorAll('[data-audio-src],[data-source-src]').forEach(function (el) {
        var s = el.getAttribute('data-source-src');
        var a = el.getAttribute('data-audio-src');
        var u = (s && s.trim()) ? s : a;   // 与 playPointAudio 优先级一致
        if (u && u.trim()) urls[u.trim()] = 1;
      });
      var list = Object.keys(urls);
      if (!list.length) return;
      var LIMIT = 4, idx = 0, active = 0;
      function done() { active--; pump(); }
      function pump() {
        while (active < LIMIT && idx < list.length) {
          var url = list[idx++]; active++;
          try {
            var au = new Audio(url);
            au.preload = 'auto';
            au.addEventListener('canplaythrough', done);
            au.addEventListener('error', done);
            au.load();   // 触发下载并进入浏览器缓存
          } catch (e) { active--; }
        }
      }
      if (window.requestIdleCallback) requestIdleCallback(pump, { timeout: 4000 });
      else setTimeout(pump, 600);
    }
    if (document.readyState === 'complete') preloadPageAudio();
    else window.addEventListener('load', preloadPageAudio);  // 页面彻底打开后
  })();
  </script>
</body>
